<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c111b" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var d = document.documentElement;
    d.className = d.className.replace(/\bno-js\b/, 'js');
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
{% include seo.html %}
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
<link rel="icon" href="{{ '/assets/icons/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}: Writing" href="{{ '/feed.xml' | relative_url }}">
{%- if page.math %}
<script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{%- endif %}
