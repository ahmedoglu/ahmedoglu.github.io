# =============================================================================
#  Site settings for ahmedoglu.github.io
#  GitHub Pages rebuilds the site automatically 1–2 minutes after each change.
# =============================================================================

title: Mümin Ahmedoğlu
description: >-
  Doctoral researcher at the University of Vienna working on defense economics
  and market design in European defense: procurement, rearmament, and the
  defense-industrial base.
url: https://ahmedoglu.github.io
baseurl: ""
repository: ahmedoglu/ahmedoglu.github.io
lang: en
timezone: Europe/Vienna

# -----------------------------------------------------------------------------
#  About you: shown on the home page, the CV, the footer, and in search results
# -----------------------------------------------------------------------------
author:
  name: Mümin Ahmedoğlu
  role: Doctoral Researcher
  department: Department of Business Decisions and Analytics
  institution: University of Vienna
  institution_url: https://www.univie.ac.at/en/
  # Where the "University of Vienna" name links to on the site (your u:cris research profile)
  affiliation_url: "https://ucrisportal.univie.ac.at/en/persons/m%C3%BCmin-ahmedoglu/"
  profile_url: https://ufind.univie.ac.at/de/person.html?id=1020207
  location: Vienna, Austria
  email: muemin.ahmedoglu@univie.ac.at
  alumni:
    - Technical University of Munich
    - Middle East Technical University
  short_bio: >-
    Doctoral researcher at the University of Vienna working on defense
    economics and market design in European defense, from procurement and
    rearmament to the defense-industrial base.
  # Put a PDF of your CV in /files/ and write its path here, e.g. /files/cv.pdf
  # to show a "Download PDF" button on the CV page.
  cv_pdf:

# Profile links. Leave a line empty to hide that link everywhere on the site.
profiles:
  google_scholar: https://scholar.google.com/citations?hl=en&user=KxX2plAAAAAJ
  orcid: https://orcid.org/0009-0006-2029-8133
  github: https://github.com/ahmedoglu
  linkedin: https://www.linkedin.com/in/ahmedoglu/
  researchgate:
  ssrn:
  substack: https://ahmedoglu.substack.com
  bluesky:
  x:

# Newsletter shown on the Writing page (posts are listed in _data/substack.yml)
newsletter:
  name: Defense Economics Notes
  url: https://ahmedoglu.substack.com
  subscribe: https://ahmedoglu.substack.com/subscribe

# -----------------------------------------------------------------------------
#  Content collections
# -----------------------------------------------------------------------------
collections:
  publications:        # papers, in _publications/
    output: true
    permalink: /research/:name/
  talks:               # presentations, in _talks/
    output: true
    permalink: /talks/:name/
  teaching:            # courses, in _teaching/ (listed on /teaching/)
    output: false

# Essays in _posts/ get addresses like /writing/file-name-without-date/
permalink: /writing/:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: publications }
    values: { layout: publication }
  - scope: { path: "", type: talks }
    values: { layout: talk }
  - scope: { path: "", type: pages }
    values: { layout: page }

# -----------------------------------------------------------------------------
#  Build settings (normally no need to change anything below)
# -----------------------------------------------------------------------------
theme: null            # use this site's own design, not GitHub's default theme
future: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml
  posts_limit: 20

include:
  - _pages            # the site's pages (home, research, CV, ...)

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .jekyll-cache
  - .sass-cache
